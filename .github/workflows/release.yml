name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the owner-approved release to npm
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  verify-release:
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --prod
      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 10
      - run: pnpm package:browser-check
      - uses: actions/upload-artifact@v4
        with:
          name: browser-release-evidence
          path: .local/release-evidence/
      - run: pnpm --dir packages/editor pack --pack-destination "$RUNNER_TEMP/scriptr-release"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release-candidate
          path: ${{ runner.temp }}/scriptr-release/*.tgz
      - name: Publish to npm using trusted publishing (OIDC)
        run: npm publish "$RUNNER_TEMP/scriptr-release/"*.tgz --access public --provenance
