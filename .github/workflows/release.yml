name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the owner-approved release to npm
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  verify-release:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
