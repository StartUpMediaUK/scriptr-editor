packages:
  - 'apps/*'
  - 'examples/*'
  - 'packages/*'

catalog:
  react: ^18.3.1 || ^19.0.0
  react-dom: ^18.3.1 || ^19.0.0

allowBuilds:
  '@parcel/watcher': false
  esbuild: true

strictPeerDependencies: true

# Keep vulnerable transitive versions out of the audited workspace graph.
overrides:
  esbuild: 0.28.2
  prosemirror-view: 1.42.6
  prosemirror-model: 1.25.12

minimumReleaseAgeExclude:
  - '@types/react-dom@19.3.0'
  - '@types/react@19.3.0'
  - fumadocs-core@16.15.9
  - fumadocs-ui@16.15.9
